<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>고양이 타입 테스트</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --bg-2: #f3ede3;

      --panel: #ffedce;
      --panel-tint: #fff6e7;

      --line: #ffc193;
      --line-soft: rgba(255, 193, 147, 0.42);
      --line-strong: #ff8383;

      --text: #3a3128;
      --muted: #8a7660;

      --point: #ffc193;
      --point-2: #ff8383;

      --shadow: 0 10px 24px rgba(160, 120, 80, 0.08);

      --radius-xl: 30px;
      --radius-lg: 24px;
      --radius-md: 18px;

      --img-bg-page: url("assets/bg_page.png");

      --img-panel-intro: url("assets/panel_intro.png");
      --img-panel-test: url("assets/panel_test.png");
      --img-panel-result: url("assets/panel_result.png");
      --img-panel-hobby: url("assets/panel_hobby.png");
      --img-panel-recommend: url("assets/panel_recommend.png");

      --img-badge-eyebrow: url("assets/badge_eyebrow.png");

      --img-btn-primary: url("assets/btn_primary.png");
      --img-btn-secondary: url("assets/btn_secondary.png");
      --img-btn-answer: url("assets/btn_answer.png");
      --img-btn-answer-selected: url("assets/btn_answer_selected.png");
      --img-btn-hobby: url("assets/btn_hobby.png");
      --img-btn-hobby-selected: url("assets/btn_hobby_selected.png");
      --img-btn-place-link: url("assets/btn_place_link.png");

      --img-box-question: url("assets/box_question.png");
      --img-badge-question: url("assets/badge_question.png");
      --img-underline-question: url("assets/underline_question.png");

      --img-progress-track: url("assets/progress_track.png");
      --img-progress-fill: url("assets/progress_fill.png");

      --img-frame-result-image: url("assets/frame_result_image.png");
      --img-card-place: url("assets/card_place.png");
      --img-thumb-place: url("assets/thumb_place.png");
      --img-badge-area: url("assets/badge_area.png");
      --img-card-status: url("assets/card_status.png");
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background-color: var(--bg);
      background-image: var(--img-bg-page), linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      background-size: cover, cover;
      background-repeat: no-repeat, no-repeat;
      background-position: center top, center;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Pretendard", sans-serif;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body { min-height: 100vh; }

    h1, h2, h3, p, strong, span, small, li, button, div {
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    button {
      white-space: normal;
      line-height: 1.35;
      min-width: 0;
      appearance: none;
      border: 0;
      background-color: transparent;
      color: var(--text);
      cursor: pointer;
      transition: transform .15s ease, filter .15s ease;
      box-shadow: none;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.02);
    }

    .wrap {
      width: min(100%, 440px);
      margin: 0 auto;
      padding: 16px 14px 40px;
    }

    .screen {
      background-color: transparent;
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: center;
      border: 0;
      border-radius: var(--radius-xl);
      box-shadow: none;
      padding: 24px 18px 22px;
      min-height: calc(100vh - 32px);
    }

    #intro-screen { background-image: var(--img-panel-intro); }
    #test-screen { background-image: var(--img-panel-test); }
    #result-screen { background-image: var(--img-panel-result); }
    #hobby-screen { background-image: var(--img-panel-hobby); }
    #recommend-screen { background-image: var(--img-panel-recommend); }

    .hidden { display: none !important; }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 10px;
    }

    .hero-cat {
      width: 180px;
      height: 180px;
      border: none;
      border-radius: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      overflow: visible;
      margin-bottom: 6px;
    }

    .hero-cat img,
    .result-image img,
    .activity-thumb img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .hero-cat img {
      transform: scale(1.08);
    }

    .image-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      padding: 12px;
      background-color: transparent;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 28px;
      padding: 6px 16px;
      border-radius: 999px;
      border: 0;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      background-color: transparent;
      background-image: var(--img-badge-eyebrow);
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: center;
      color: var(--muted);
    }

    h1, h2, h3, p { margin: 0; }

    h1 {
      font-size: clamp(34px, 10vw, 48px);
      line-height: 1.05;
      letter-spacing: -0.05em;
      color: var(--text);
    }

    .hero-sub {
      font-size: 16px;
      font-weight: 700;
      color: var(--muted);
      margin-top: 2px;
    }

    .hero-actions {
      width: 100%;
      margin-top: 22px;
    }

    .hero-actions button,
    .nav-btn,
    .cta-btn {
      width: 100%;
      min-height: 58px;
      padding: 14px 18px;
      border-radius: 999px;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .primary {
      background-color: transparent;
      background-image: var(--img-btn-primary);
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: center;
      color: #3a3128;
      border-color: transparent;
      box-shadow: none;
    }

    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .progress-text {
      font-size: 13px;
      font-weight: 800;
      color: var(--muted);
      min-width: 52px;
      text-align: center;
    }

    .progress-bar {
      flex: 1;
      height: 14px;
      border-radius: 999px;
      background-color: transparent;
      background-image: var(--img-progress-track);
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: center;
      overflow: hidden;
      border: none;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background-color: transparent;
      background-image: var(--img-progress-fill);
      background-size: auto 100%;
      background-repeat: repeat-x;
      background-position: left center;
      transition: width 0.25s ease;
    }

    .question-wrap {
      margin-top: 6px;
      padding: 24px 20px 22px;
      border: 0;
      border-radius: 30px;
      background-color: transparent;
      background-image: var(--img-box-question);
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: center;
      position: relative;
      box-shadow: none;
    }

    .question-wrap::before,
    .question-wrap::after {
      display: none;
    }

    .question-kicker {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 32px;
      padding: 7px 14px;
      border-radius: 999px;
      border: 0;
      background-color: transparent;
      background-image: var(--img-badge-question);
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: center;
      font-size: 12px;
      font-weight: 800;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .question-scene {
      font-size: 34px;
      line-height: 1.22;
      letter-spacing: -0.05em;
      margin: 34px 0 34px;
      text-align: center;
      color: var(--text);
      padding: 0 10px 20px;
      position: relative;
    }

    .question-scene::after {
      content: '';
      display: block;
      width: 120px;
      height: 6px;
      border-radius: 999px;
      margin: 18px auto 0;
      background-color: transparent;
      background-image: var(--img-underline-question);
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: center;
    }

    .answer-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 6px;
    }

    .answer-btn {
      min-height: 176px;
      padding: 22px 22px;
      border-radius: 28px;
      text-align: left;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.03em;
      background-color: transparent;
      background-image: var(--img-btn-answer);
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: center;
      border-color: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      color: var(--text);
      box-shadow: none;
    }

    .answer-btn::before {
      content: attr(data-choice);
      position: absolute;
      top: 18px;
      left: 18px;
      width: 44px;
      height: 44px;
      border-radius: 18px;
      border: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 800;
      color: var(--muted);
      background: transparent;
    }

    .answer-btn.selected {
      background-color: transparent;
      background-image: var(--img-btn-answer-selected);
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: center;
      border-color: transparent;
      box-shadow: none;
    }

    .controls {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .controls button {
      flex: 1;
      min-height: 56px;
      border-radius: 22px;
      font-size: 16px;
      font-weight: 800;
      padding: 14px 16px;
      background-color: transparent;
      background-image: var(--img-btn-secondary);
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: center;
      box-shadow: none;
    }

    .controls button.primary {
      background-image: var(--img-btn-primary);
    }

    .controls button:disabled {
      opacity: .42;
      cursor: not-allowed;
      transform: none;
      filter: none;
    }

    .section-title {
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: -0.04em;
      margin-bottom: 14px;
      color: var(--text);
    }

    .result-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 24px;
      border: 0;
      background-color: transparent;
      background-image: var(--img-frame-result-image);
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: center;
      overflow: hidden;
      margin-bottom: 16px;
      padding: 16px;
    }

    .result-type {
      font-size: 34px;
      line-height: 1.06;
      letter-spacing: -0.05em;
      margin-bottom: 8px;
      color: var(--text);
    }

    .result-sub {
      font-size: 16px;
      font-weight: 700;
      color: #ff8383;
      line-height: 1.5;
      margin-bottom: 14px;
    }

    .result-body {
      font-size: 16px;
      line-height: 1.75;
      margin-bottom: 20px;
      color: var(--text);
    }

    .hobby-title,
    .recommend-title {
      font-size: 30px;
      line-height: 1.1;
      letter-spacing: -0.05em;
      margin-bottom: 10px;
      color: var(--text);
    }

    .recommend-sub {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.55;
      color: var(--muted);
      margin-bottom: 18px;
    }

    .hobby-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-top: 8px;
    }

    .hobby-btn {
      min-height: 72px;
      padding: 10px 8px;
      border-radius: 18px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.03em;
      text-align: center;
      background-color: transparent;
      background-image: var(--img-btn-hobby);
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      box-shadow: none;
    }

    .hobby-btn.selected {
      background-color: transparent;
      background-image: var(--img-btn-hobby-selected);
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: center;
      border-color: transparent;
    }

    .activity-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      margin-top: 10px;
    }

    .activity-card {
      border: 0;
      border-radius: 24px;
      padding: 22px;
      background-color: transparent;
      background-image: var(--img-card-place);
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: center;
      box-shadow: none;
    }

    .activity-thumb {
      width: 100%;
      aspect-ratio: 16 / 10;
      border-radius: 18px;
      overflow: hidden;
      background-color: transparent;
      background-image: var(--img-thumb-place);
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: center;
      border: 0;
      margin-bottom: 12px;
    }

    .activity-name {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
      color: var(--text);
    }

    .activity-area {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 5px 12px;
      border-radius: 999px;
      border: 0;
      background-color: transparent;
      background-image: var(--img-badge-area);
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: center;
      color: #ff8383;
      font-size: 12px;
      font-weight: 900;
      margin-bottom: 10px;
    }

    .activity-desc {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.55;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .activity-link {
      width: 100%;
      min-height: 50px;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 800;
      padding: 12px 14px;
      background-color: transparent;
      background-image: var(--img-btn-place-link);
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: center;
      color: var(--text);
      box-shadow: none;
    }

    .status-card {
      border: 0;
      border-radius: 24px;
      padding: 18px;
      background-color: transparent;
      background-image: var(--img-card-status);
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: center;
      box-shadow: none;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.6;
      color: var(--muted);
    }

    .status-card strong {
      display: block;
      color: var(--text);
      font-size: 18px;
      line-height: 1.35;
      margin-bottom: 6px;
      letter-spacing: -0.03em;
    }

    .stack-gap { display: grid; gap: 12px; }

    @media (max-width: 420px) {
      .question-scene {
        font-size: 29px;
      }

      .answer-btn {
        min-height: 156px;
        font-size: 18px;
        padding: 20px 18px;
      }

      .hobby-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (min-width: 768px) {
      .wrap { width: min(100%, 560px); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="screen hero" id="intro-screen">
      <div class="hero-cat" id="intro-cat"></div>
      <h1>고양이 타입 테스트</h1>
      <div class="hero-sub">고양이같은 삶 테스트</div>
      <div class="hero-actions">
        <button class="primary" id="start-btn">테스트 시작하기</button>
      </div>
    </section>

    <section class="screen hidden" id="test-screen">
      <div class="progress-wrap">
        <div class="progress-text" id="progress-label">1 / 16</div>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </div>
      <div class="question-wrap" id="question-container"></div>
      <div class="controls">
        <button id="prev-btn">이전</button>
        <button class="primary" id="next-btn" disabled>다음</button>
      </div>
    </section>

    <section class="screen hidden" id="result-screen">
      <div class="section-title">테스트 결과</div>
      <div class="result-image" id="result-image"></div>
      <div class="result-type" id="result-type"></div>
      <div class="result-sub" id="result-sub"></div>
      <div class="result-body" id="result-body"></div>
      <button class="primary cta-btn" id="to-hobby-btn">내 취미 고르기</button>
    </section>

    <section class="screen hidden" id="hobby-screen">
      <div class="hobby-title">요즘 뭐 하고 지내?</div>
      <div class="hobby-grid" id="hobby-grid"></div>
      <div class="controls">
        <button id="back-to-result-btn">결과로 돌아가기</button>
      </div>
    </section>

    <section class="screen hidden" id="recommend-screen">
      <div class="recommend-title" id="recommend-title"></div>
      <div class="recommend-sub" id="recommend-sub"></div>
      <div class="activity-grid" id="activity-grid"></div>
      <div class="controls">
        <button id="back-to-hobby-btn">취미 다시 고르기</button>
        <button class="primary" id="restart-btn">처음부터 다시</button>
      </div>
    </section>
  </div>

  <script>
    const CAT_IMAGES = {
      intro: 'assets/cat_intro.png',
      home: 'assets/cat_home.png',
      hedgehog: 'assets/cat_hedgehog.png',
      blurry: 'assets/cat_blurry.png',
      window: 'assets/cat_window.png'
    };

    const TYPES = {
      home: {
        name: '집이 좋아냥이',
        short: '혼자 잘 지내서 굳이 다른 사람 생각이 안 나는 고양이',
        body: '혼자 있는 시간이 너무 잘 맞는다. 굳이 누가 없어도 하루가 꽉 찬 느낌이라, 사람은 선택사항에 가깝다. 누가 들어오기엔 이미 구조가 너무 완성돼 있는 상태.',
        imageKey: 'home'
      },
      hedgehog: {
        name: '고슴도치 냥이',
        short: '가까워지기 어렵고 무서워서 일단 관찰하는 고양이',
        body: '사람이 싫은 건 아닌데, 가까워지기 전에 먼저 거리부터 재게 된다. 괜히 다가갔다가 어색해질까 봐, 일단 보고 있는 시간이 더 길다.',
        imageKey: 'hedgehog'
      },
      blurry: {
        name: '흐리멍텅 냥이',
        short: '감정과 생각이 좀 흐리멍텅한 고양이',
        body: '외로운 건지, 편한 건지, 좋은 건지 그냥 그런 건지 애매하다. 느낌은 있는데 딱 잡히지 않아서, 관계도 항상 애매하게 지나가는 편.',
        imageKey: 'blurry'
      },
      window: {
        name: '창밖만 보냥이',
        short: '바깥이 궁금하긴 한데 나가기 귀찮은 고양이',
        body: '사람도 궁금하고, 바깥도 궁금하다. 근데 막상 움직이긴 귀찮다. 그래서 계속 창밖만 보다가 결국 그대로 하루가 끝난다.',
        imageKey: 'window'
      }
    };

    const QUESTIONS = [
      {
        id: 1,
        scene: '친구가 갑자기 약속 잡자고 한다',
        options: [
          { text: '나간다', type: 'window' },
          { text: '집이 더 좋다', type: 'home' }
        ]
      },
      {
        id: 2,
        scene: '집에 혼자 있는 주말',
        options: [
          { text: '완벽하다', type: 'home' },
          { text: '좀 심심하다', type: 'window' }
        ]
      },
      {
        id: 3,
        scene: '새로운 사람 만났을 때',
        options: [
          { text: '바로 편하다', type: 'window' },
          { text: '거리 둔다', type: 'hedgehog' }
        ]
      },
      {
        id: 4,
        scene: '누가 연락 끊기면',
        options: [
          { text: '별 생각 없다', type: 'home' },
          { text: '신경 쓰인다', type: 'blurry' }
        ]
      },
      {
        id: 5,
        scene: '누가 나한테 관심 보이면',
        options: [
          { text: '괜찮다', type: 'window' },
          { text: '살짝 부담된다', type: 'hedgehog' }
        ]
      },
      {
        id: 6,

          link: 'https://map.kakao.com/link/search/더현대 서울'
        }
      ],

      '패션': [
        {
          name: '무신사 스토어 홍대',
          area: '서울 마포구',
          description: '패션 취향을 확인하러 가기 좋은 목적형 공간.',
          link: 'https://map.kakao.com/link/search/무신사 스토어 홍대'
        },
        {
          name: '한남동 편집샵 거리',
          area: '서울 용산구',
          description: '브랜드와 스타일을 천천히 관찰하기 좋은 지역.',
          link: 'https://map.kakao.com/link/search/한남동 편집샵'
        },
        {
          name: '성수동 편집샵 거리',
          area: '서울 성동구',
          description: '패션, 카페, 브랜드 쇼룸이 연결되는 동네.',
          link: 'https://map.kakao.com/link/search/성수동 편집샵'
        }
      ],

      '전시': [
        {
          name: '국립현대미술관 서울',
          area: '서울 종로구',
          description: '혼자 관람하기 좋은 대표 미술관.',
          link: 'https://map.kakao.com/link/search/국립현대미술관 서울'
        },
        {
          name: '서울시립미술관',
          area: '서울 중구',
          description: '전시 입문자도 부담 없이 방문하기 좋은 공공 미술관.',
          link: 'https://map.kakao.com/link/search/서울시립미술관'
        },
        {
          name: '리움미술관',
          area: '서울 용산구',
          description: '전시와 공간 경험이 강한 미술관.',
          link: 'https://map.kakao.com/link/search/리움미술관'
        }
      ],

      '공연': [
        {
          name: '노들섬 라이브하우스',
          area: '서울 용산구',
          description: '공연을 목적으로 외출하기 좋은 장소.',
          link: 'https://map.kakao.com/link/search/노들섬 라이브하우스'
        },
        {
          name: '블루스퀘어',
          area: '서울 용산구',
          description: '뮤지컬과 공연 관람 목적이 분명한 공간.',
          link: 'https://map.kakao.com/link/search/블루스퀘어'
        },
        {
          name: '롤링홀',
          area: '서울 마포구 홍대',
          description: '라이브 공연을 통해 부담 낮은 외부 경험을 만들기 좋음.',
          link: 'https://map.kakao.com/link/search/롤링홀'
        }
      ],

      '클라이밍': [
        {
          name: '더클라임 홍대점',
          area: '서울 마포구',
          description: '혼자 가도 운동 목적이 분명한 클라이밍장.',
          link: 'https://map.kakao.com/link/search/더클라임 홍대점'
        },
        {
          name: '더클라임 강남점',
          area: '서울 강남구',
          description: '초보자도 목적형 활동으로 접근하기 쉬운 실내 클라이밍장.',
          link: 'https://map.kakao.com/link/search/더클라임 강남점'
        },
        {
          name: '볼더프렌즈',
          area: '서울 내 지점 검색',
          description: '혼자 운동을 시작하기 좋은 볼더링 공간.',
          link: 'https://map.kakao.com/link/search/볼더프렌즈'
        }
      ]
    };

    let currentIndex = 0;
    let shuffledQuestions = [];
    const answers = {};
    let selectedHobby = null;

    const introScreen = document.getElementById('intro-screen');
    const testScreen = document.getElementById('test-screen');
    const resultScreen = document.getElementById('result-screen');
    const hobbyScreen = document.getElementById('hobby-screen');
    const recommendScreen = document.getElementById('recommend-screen');

    const startBtn = document.getElementById('start-btn');
    const questionContainer = document.getElementById('question-container');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const progressFill = document.getElementById('progress-fill');
    const progressLabel = document.getElementById('progress-label');

    const resultImage = document.getElementById('result-image');
    const resultType = document.getElementById('result-type');
    const resultSub = document.getElementById('result-sub');
    const resultBody = document.getElementById('result-body');
    const toHobbyBtn = document.getElementById('to-hobby-btn');

    const hobbyGrid = document.getElementById('hobby-grid');
    const backToResultBtn = document.getElementById('back-to-result-btn');

    const recommendTitle = document.getElementById('recommend-title');
    const recommendSub = document.getElementById('recommend-sub');
    const activityGrid = document.getElementById('activity-grid');
    const backToHobbyBtn = document.getElementById('back-to-hobby-btn');
    const restartBtn = document.getElementById('restart-btn');

    function showScreen(screen) {
      [introScreen, testScreen, resultScreen, hobbyScreen, recommendScreen].forEach(s => s.classList.add('hidden'));
      screen.classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderImage(container, src, fallbackText) {
      if (src) {
        container.innerHTML = `<img src="${src}" alt="${fallbackText}">`;
      } else {
        container.innerHTML = `<div class="image-placeholder">${fallbackText}</div>`;
      }
    }

    function shuffleArray(arr) {
      const copy = [...arr];

      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }

      return copy;
    }

    function buildShuffledQuestions() {
      shuffledQuestions = shuffleArray(QUESTIONS);
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function renderQuestion() {
      const q = shuffledQuestions[currentIndex];
      const selected = answers[q.id] ?? null;

      questionContainer.innerHTML = `
        <div class="question-kicker">Q ${currentIndex + 1}</div>
        <div class="question-scene">${escapeHtml(q.scene)}</div>
        <div class="answer-list">
          ${q.options.map((option, index) => `
            <button class="answer-btn ${selected === index ? 'selected' : ''}" data-index="${index}" data-choice="${index === 0 ? 'A' : 'B'}">
              ${escapeHtml(option.text)}
            </button>
          `).join('')}
        </div>
      `;

      [...questionContainer.querySelectorAll('.answer-btn')].forEach(btn => {
        btn.addEventListener('click', () => {
          answers[q.id] = Number(btn.dataset.index);
          renderQuestion();
        });
      });

      prevBtn.disabled = currentIndex === 0;
      nextBtn.disabled = selected === null;
      progressFill.style.width = `${((currentIndex + 1) / shuffledQuestions.length) * 100}%`;
      progressLabel.textContent = `${currentIndex + 1} / ${shuffledQuestions.length}`;
      nextBtn.textContent = currentIndex === shuffledQuestions.length - 1 ? '결과 보기' : '다음';
    }

    function computeResultType() {
      const scores = { home: 0, hedgehog: 0, blurry: 0, window: 0 };

      QUESTIONS.forEach(q => {
        const pickedIndex = answers[q.id];
        if (pickedIndex === undefined) return;

        const picked = q.options[pickedIndex];
        scores[picked.type] += 1;
      });

      return Object.entries(scores).sort((a, b) => b[1] - a[1])[0][0];
    }

    function renderResult() {
      const typeKey = computeResultType();
      const type = TYPES[typeKey];

      renderImage(resultImage, CAT_IMAGES[type.imageKey], '고양이 이미지 넣기');
      resultType.textContent = type.name;
      resultSub.textContent = type.short;
      resultBody.textContent = type.body;
    }

    function renderHobbies() {
      hobbyGrid.innerHTML = HOBBIES.map(hobby => `
        <button class="hobby-btn ${selectedHobby === hobby ? 'selected' : ''}" data-hobby="${escapeHtml(hobby)}">${escapeHtml(hobby)}</button>
      `).join('');

      [...hobbyGrid.querySelectorAll('.hobby-btn')].forEach(btn => {
        btn.addEventListener('click', () => {
          selectedHobby = btn.dataset.hobby;
          showScreen(recommendScreen);
          renderRecommendations();
        });
      });
    }

    function renderRecommendations() {
      if (!selectedHobby) return;

      recommendTitle.textContent = RECOMMEND_TITLES[Math.floor(Math.random() * RECOMMEND_TITLES.length)];
      recommendSub.textContent = `${selectedHobby} 기준으로 서울 안에서 혼자 가도 어색하지 않은 장소를 골랐어.`;

      const items = STATIC_SEOUL_RECOMMENDATIONS[selectedHobby] || [];

      if (!items.length) {
        activityGrid.innerHTML = `
          <div class="status-card">
            <strong>추천 장소 없음</strong>
            아직 이 취미에 연결된 서울 장소가 없어.
          </div>
        `;
        return;
      }

      activityGrid.innerHTML = items.map(item => `
        <div class="activity-card">
          <div class="activity-thumb">
            <div class="image-placeholder">서울 고정 추천</div>
          </div>
          <div class="activity-name">${escapeHtml(item.name)}</div>
          <div class="activity-area">${escapeHtml(item.area)}</div>
          <div class="activity-desc">${escapeHtml(item.description)}</div>
          <button class="activity-link" data-link="${escapeHtml(item.link)}">카카오맵에서 보기</button>
        </div>
      `).join('');

      [...activityGrid.querySelectorAll('.activity-link')].forEach(btn => {
        btn.addEventListener('click', () => {
          const link = btn.dataset.link;

          if (link && link !== '#') {
            window.open(link, '_blank', 'noopener,noreferrer');
          }
        });
      });
    }

    renderImage(document.getElementById('intro-cat'), CAT_IMAGES.intro, '고양이 이미지 넣기');

    startBtn.addEventListener('click', () => {
      currentIndex = 0;
      buildShuffledQuestions();
      showScreen(testScreen);
      renderQuestion();
    });

    prevBtn.addEventListener('click', () => {
      if (currentIndex > 0) {
        currentIndex -= 1;
        renderQuestion();
      }
    });

    nextBtn.addEventListener('click', () => {
      const q = shuffledQuestions[currentIndex];

      if (answers[q.id] === undefined) return;

      if (currentIndex === shuffledQuestions.length - 1) {
        renderResult();
        showScreen(resultScreen);
        return;
      }

      currentIndex += 1;
      renderQuestion();
    });

    toHobbyBtn.addEventListener('click', () => {
      renderHobbies();
      showScreen(hobbyScreen);
    });

    backToResultBtn.addEventListener('click', () => showScreen(resultScreen));
    backToHobbyBtn.addEventListener('click', () => showScreen(hobbyScreen));

    restartBtn.addEventListener('click', () => {
      currentIndex = 0;
      selectedHobby = null;
      shuffledQuestions = [];
      Object.keys(answers).forEach(key => delete answers[key]);
      showScreen(introScreen);
    });
  </script>
</body>
</html>

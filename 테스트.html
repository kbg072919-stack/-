<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>고양이 타입 테스트</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --bg-2: #f3ede3;

      --panel: #ffedce;
      --panel-tint: #fff6e7;

      --line: #ffc193;
      --line-soft: rgba(255, 193, 147, 0.42);
      --line-strong: #ff8383;

      --text: #3a3128;
      --muted: #8a7660;

      --point: #ffc193;
      --point-2: #ff8383;

      --shadow: 0 10px 24px rgba(160, 120, 80, 0.08);

      --radius-xl: 30px;
      --radius-lg: 24px;
      --radius-md: 18px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Pretendard", sans-serif;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body { min-height: 100vh; }

    h1, h2, h3, p, strong, span, small, li, button, div {
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    button {
      white-space: normal;
      line-height: 1.35;
      min-width: 0;
      appearance: none;
      border: 1.5px solid var(--line);
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      transition: transform .15s ease, background .15s ease, box-shadow .15s ease;
      box-shadow: var(--shadow);
    }

    button:hover { transform: translateY(-1px); }

    .wrap {
      width: min(100%, 440px);
      margin: 0 auto;
      padding: 16px 14px 40px;
    }

    .screen {
      background: var(--panel);
      border: 1.5px solid var(--line);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      padding: 24px 18px 22px;
      min-height: calc(100vh - 32px);
    }

    .hidden { display: none !important; }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 10px;
    }

    .hero-cat {
      width: 180px;
      height: 180px;
      border: none;
      border-radius: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      overflow: visible;
      margin-bottom: 6px;
    }

    .hero-cat img,
    .result-image img,
    .activity-thumb img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .hero-cat img {
      transform: scale(1.08);
    }

    .image-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 13px;
      background: var(--panel-tint);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 28px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1.5px solid var(--line);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      background: var(--panel-tint);
      color: var(--muted);
    }

    h1, h2, h3, p { margin: 0; }

    h1 {
      font-size: clamp(34px, 10vw, 48px);
      line-height: 1.05;
      letter-spacing: -0.05em;
      color: var(--text);
    }

    .hero-sub {
      font-size: 16px;
      font-weight: 700;
      color: var(--muted);
      margin-top: 2px;
    }

    .hero-actions {
      width: 100%;
      margin-top: 22px;
    }

    .hero-actions button,
    .nav-btn,
    .cta-btn {
      width: 100%;
      min-height: 58px;
      padding: 14px 18px;
      border-radius: 999px;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .primary {
      background: #ff8383;
      color: #fff8f5;
      border-color: #ff8383;
    }

    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .progress-text {
      font-size: 13px;
      font-weight: 800;
      color: var(--muted);
      min-width: 52px;
      text-align: center;
    }

    .progress-bar {
      flex: 1;
      height: 14px;
      border-radius: 999px;
      background: #ffe3c8;
      overflow: hidden;
      border: none;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: #ff8383;
      transition: width 0.25s ease;
    }

    .question-wrap {
      margin-top: 6px;
      padding: 18px 16px 16px;
      border: 1.5px solid var(--line);
      border-radius: 30px;
      background: var(--panel-tint);
      position: relative;
    }

    .question-wrap::before,
    .question-wrap::after {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 999px;
      background: #ffc193;
      opacity: .75;
    }

    .question-wrap::before {
      top: 112px;
      left: 18px;
    }

    .question-wrap::after {
      top: 138px;
      right: 22px;
    }

    .question-kicker {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1.5px solid var(--line);
      background: var(--panel);
      font-size: 12px;
      font-weight: 800;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .question-scene {
      font-size: 34px;
      line-height: 1.22;
      letter-spacing: -0.05em;
      margin: 34px 0 34px;
      text-align: center;
      color: var(--text);
      padding: 0 10px 20px;
      position: relative;
    }

    .question-scene::after {
      content: '';
      display: block;
      width: 120px;
      height: 6px;
      border-radius: 999px;
      margin: 18px auto 0;
      background: #ff8383;
    }

    .answer-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 6px;
    }

    .answer-btn {
      min-height: 176px;
      padding: 22px 22px;
      border-radius: 28px;
      text-align: left;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: var(--panel);
      border-color: var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      color: var(--text);
    }

    .answer-btn::before {
      content: attr(data-choice);
      position: absolute;
      top: 18px;
      left: 18px;
      width: 44px;
      height: 44px;
      border-radius: 18px;
      border: 1.5px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 800;
      color: var(--muted);
      background: var(--panel-tint);
    }

    .answer-btn.selected {
      background: #fff3e0;
      border-color: #ff8383;
      box-shadow: 0 12px 24px rgba(255, 131, 131, 0.22);
    }

    .controls {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .controls button {
      flex: 1;
      min-height: 56px;
      border-radius: 22px;
      font-size: 16px;
      font-weight: 800;
      padding: 14px 16px;
    }

    .controls button:disabled {
      opacity: .42;
      cursor: not-allowed;
      transform: none;
    }

    .section-title {
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: -0.04em;
      margin-bottom: 14px;
      color: var(--text);
    }

    .result-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 24px;
      border: 1.5px solid var(--line-soft);
      background: var(--panel-tint);
      overflow: hidden;
      margin-bottom: 16px;
    }

    .result-type {
      font-size: 34px;
      line-height: 1.06;
      letter-spacing: -0.05em;
      margin-bottom: 8px;
      color: var(--text);
    }

    .result-sub {
      font-size: 16px;
      font-weight: 700;
      color: #ff8383;
      line-height: 1.5;
      margin-bottom: 14px;
    }

    .result-body {
      font-size: 16px;
      line-height: 1.75;
      margin-bottom: 20px;
      color: var(--text);
    }

    .hobby-title,
    .recommend-title {
      font-size: 30px;
      line-height: 1.1;
      letter-spacing: -0.05em;
      margin-bottom: 18px;
      color: var(--text);
    }

    .hobby-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-top: 8px;
    }

    .hobby-btn {
      min-height: 72px;
      padding: 10px 8px;
      border-radius: 18px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.03em;
      text-align: center;
      background: var(--panel);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
    }

    .hobby-btn.selected {
      background: #ffc193;
      border-color: #ff8383;
    }

    .activity-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      margin-top: 10px;
    }

    .activity-card {
      border: 1.5px solid var(--line-soft);
      border-radius: 24px;
      padding: 12px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .activity-thumb {
      width: 100%;
      aspect-ratio: 16 / 10;
      border-radius: 18px;
      overflow: hidden;
      background: var(--panel-tint);
      border: 1.5px solid var(--line-soft);
      margin-bottom: 12px;
    }

    .activity-name {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 10px;
      color: var(--text);
    }

    .activity-link {
      width: 100%;
      min-height: 50px;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 800;
      padding: 12px 14px;
      background: #ffc193;
      color: var(--text);
    }

    .stack-gap { display: grid; gap: 12px; }

    @media (max-width: 420px) {
      .question-scene {
        font-size: 29px;
      }

      .answer-btn {
        min-height: 156px;
        font-size: 18px;
        padding: 20px 18px;
      }
    }

    @media (min-width: 768px) {
      .wrap { width: min(100%, 560px); }
    }
  </style>
</head>

      ],
      '여행': [

        { name: 'Busan Gamcheon Culture Village', image: '', link: '#' }
      ],
      '사진': [
        { name: 'Ikseon-dong', image: '', link: '#' },
        { name: 'Seongsu-dong', image: '', link: '#' },
        { name: 'Dongdaemun Design Plaza', image: '', link: '#' }
      ],
      '그림': [

      ],
      '글쓰기': [

        { name: 'Textbook Writing Space', image: '', link: '#' },
        { name: 'Seoul Writing Cafe', image: '', link: '#' }
      ],
      '쇼핑': [
        { name: 'Garosu-gil', image: '', link: '#' },
        { name: 'Hongdae Street', image: '', link: '#' },
        { name: 'Common Ground', image: '', link: '#' }
      ],
      '패션': [
        { name: 'Garosu-gil', image: '', link: '#' },
        { name: 'Hongdae Street', image: '', link: '#' },
        { name: 'Common Ground', image: '', link: '#' }
      ],
      '전시': [
        { name: 'Leeum Samsung Museum of Art', image: '', link: '#' },
        { name: 'MMCA Seoul', image: '', link: '#' },
        { name: 'Seoul Museum of Art', image: '', link: '#' }
      ],
      '공연': [
        { name: 'Hongdae Live Club', image: '', link: '#' },
        { name: 'Blue Square', image: '', link: '#' },
        { name: 'Nodeul Island', image: '', link: '#' }
      ],
      '클라이밍': [
        { name: 'The Climb', image: '', link: '#' },
        { name: 'Climb Square', image: '', link: '#' },
        { name: 'Boulder Friends', image: '', link: '#' }
      ]
    };

    let currentIndex = 0;
    let shuffledQuestions = [];
    const answers = {};
    let selectedHobby = null;

    const introScreen = document.getElementById('intro-screen');
    const testScreen = document.getElementById('test-screen');
    const resultScreen = document.getElementById('result-screen');
    const hobbyScreen = document.getElementById('hobby-screen');
    const recommendScreen = document.getElementById('recommend-screen');

    const startBtn = document.getElementById('start-btn');
    const questionContainer = document.getElementById('question-container');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const progressFill = document.getElementById('progress-fill');
    const progressLabel = document.getElementById('progress-label');

    const resultImage = document.getElementById('result-image');
    const resultType = document.getElementById('result-type');
    const resultSub = document.getElementById('result-sub');
    const resultBody = document.getElementById('result-body');
    const toHobbyBtn = document.getElementById('to-hobby-btn');

    const hobbyGrid = document.getElementById('hobby-grid');
    const backToResultBtn = document.getElementById('back-to-result-btn');

    const recommendTitle = document.getElementById('recommend-title');
    const activityGrid = document.getElementById('activity-grid');
    const backToHobbyBtn = document.getElementById('back-to-hobby-btn');
    const restartBtn = document.getElementById('restart-btn');

    function showScreen(screen) {
      [introScreen, testScreen, resultScreen, hobbyScreen, recommendScreen].forEach(s => s.classList.add('hidden'));
      screen.classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderImage(container, src, fallbackText) {
      if (src) {
        container.innerHTML = `<img src="${src}" alt="${fallbackText}">`;
      } else {
        container.innerHTML = `<div class="image-placeholder">${fallbackText}</div>`;
      }
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function buildShuffledQuestions() {
      shuffledQuestions = shuffleArray(QUESTIONS);
    }

    function renderQuestion() {
      const q = shuffledQuestions[currentIndex];
      const selected = answers[q.id] ?? null;
      questionContainer.innerHTML = `
        <div class="question-kicker">Q ${currentIndex + 1}</div>
        <div class="question-scene">${q.scene}</div>
        <div class="answer-list">
          ${q.options.map((option, index) => `
            <button class="answer-btn ${selected === index ? 'selected' : ''}" data-index="${index}" data-choice="${index === 0 ? 'A' : 'B'}">
              ${option.text}
            </button>
          `).join('')}
        </div>
      `;

      [...questionContainer.querySelectorAll('.answer-btn')].forEach(btn => {
        btn.addEventListener('click', () => {
          answers[q.id] = Number(btn.dataset.index);
          renderQuestion();
        });
      });

      prevBtn.disabled = currentIndex === 0;
      nextBtn.disabled = selected === null;
      progressFill.style.width = `${((currentIndex + 1) / shuffledQuestions.length) * 100}%`;
      progressLabel.textContent = `${currentIndex + 1} / ${shuffledQuestions.length}`;
      nextBtn.textContent = currentIndex === shuffledQuestions.length - 1 ? '결과 보기' : '다음';
    }

    function computeResultType() {
      const scores = { home: 0, hedgehog: 0, blurry: 0, window: 0 };
      QUESTIONS.forEach(q => {
        const pickedIndex = answers[q.id];
        if (pickedIndex === undefined) return;
        const picked = q.options[pickedIndex];
        scores[picked.type] += 1;
      });

      return Object.entries(scores).sort((a, b) => b[1] - a[1])[0][0];
    }

    function renderResult() {
      const typeKey = computeResultType();
      const type = TYPES[typeKey];
      renderImage(resultImage, CAT_IMAGES[type.imageKey], '고양이 이미지 넣기');
      resultType.textContent = type.name;
      resultSub.textContent = type.short;
      resultBody.textContent = type.body;
    }

    function renderHobbies() {
      hobbyGrid.innerHTML = HOBBIES.map(hobby => `
        <button class="hobby-btn ${selectedHobby === hobby ? 'selected' : ''}" data-hobby="${hobby}">${hobby}</button>
      `).join('');

      [...hobbyGrid.querySelectorAll('.hobby-btn')].forEach(btn => {
        btn.addEventListener('click', () => {
          selectedHobby = btn.dataset.hobby;
          renderRecommendations();
          showScreen(recommendScreen);
        });
      });
    }

    function renderRecommendations() {
      recommendTitle.textContent = RECOMMEND_TITLES[Math.floor(Math.random() * RECOMMEND_TITLES.length)];
      const items = RECOMMENDATIONS[selectedHobby] || [];
      activityGrid.innerHTML = items.map(item => `
        <div class="activity-card">
          <div class="activity-thumb">${item.image ? `<img src="${item.image}" alt="${item.name}">` : `<div class="image-placeholder">이미지 넣기</div>`}</div>
          <div class="activity-name">${item.name}</div>
          <button class="activity-link" data-link="${item.link}">보러가기</button>
        </div>
      `).join('');

      [...activityGrid.querySelectorAll('.activity-link')].forEach(btn => {
        btn.addEventListener('click', () => {
          const link = btn.dataset.link;
          if (link && link !== '#') {
            window.open(link, '_blank', 'noopener,noreferrer');
          }
        });
      });
    }

    renderImage(document.getElementById('intro-cat'), CAT_IMAGES.intro, '고양이 이미지 넣기');

    startBtn.addEventListener('click', () => {
      currentIndex = 0;
      buildShuffledQuestions();
      showScreen(testScreen);
      renderQuestion();
    });

    prevBtn.addEventListener('click', () => {
      if (currentIndex > 0) {
        currentIndex -= 1;
        renderQuestion();
      }
    });

    nextBtn.addEventListener('click', () => {
      const q = shuffledQuestions[currentIndex];
      if (answers[q.id] === undefined) return;
      if (currentIndex === shuffledQuestions.length - 1) {
        renderResult();
        showScreen(resultScreen);
        return;
      }
      currentIndex += 1;
      renderQuestion();
    });

    toHobbyBtn.addEventListener('click', () => {
      renderHobbies();
      showScreen(hobbyScreen);
    });

    backToResultBtn.addEventListener('click', () => showScreen(resultScreen));
    backToHobbyBtn.addEventListener('click', () => showScreen(hobbyScreen));

    restartBtn.addEventListener('click', () => {
      currentIndex = 0;
      selectedHobby = null;
      shuffledQuestions = [];
      Object.keys(answers).forEach(key => delete answers[key]);
      showScreen(introScreen);
    });
  </script>
